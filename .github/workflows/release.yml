name: Build & Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-win-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish Standalone (self-contained single-file win-x64)
        run: >
          dotnet publish FlightStrips.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -o publish/standalone

      - name: Publish Lite (framework-dependent unbundled win-x64)
        run: >
          dotnet publish FlightStrips.csproj -c Release -r win-x64 --self-contained false
          -p:DebugType=None
          -o publish/lite

      - name: Package release zips
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "README.md" "publish/standalone/README.md" -Force
          Copy-Item "README.md" "publish/lite/README.md" -Force
          Compress-Archive -Path "publish/standalone/*" -DestinationPath "release/FlightStrips-Standalone-NoDotNetNeeded-win-x64.zip" -CompressionLevel Optimal -Force
          Compress-Archive -Path "publish/lite/*" -DestinationPath "release/FlightStrips-Lite-RequiresDotNet10-win-x64.zip" -CompressionLevel Optimal -Force

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/FlightStrips-Standalone-NoDotNetNeeded-win-x64.zip
            release/FlightStrips-Lite-RequiresDotNet10-win-x64.zip
          body: |
            ## Which file should I download?

            - **Recommended (most users): `FlightStrips-Standalone-NoDotNetNeeded-win-x64.zip`**
              - Includes the .NET 10 runtime — just extract and double-click `FlightStrips.exe`.
            - **Lite / Tiny build: `FlightStrips-Lite-RequiresDotNet10-win-x64.zip`**
              - Small unbundled package if you already have **.NET 10 Desktop Runtime** installed.

            ### Requirements
            - Windows 10 / 11 (x64)
            - [Airside ATC Simulator](https://airsideatc.com/) with **Settings -> Mods for Airside -> On**
            - Microsoft Edge WebView2 Runtime (built into Windows 10/11)

            📖 **Showcase & Guide:** https://rostykk.github.io/flight-strips/
          generate_release_notes: true
